name: Monthly reliability check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Check no local secret file was accidentally tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch .streamlit/secrets.toml >/dev/null 2>&1; then
            echo 'Do not commit Streamlit credentials.'
            exit 1
          fi
      - name: Prevent accidental private-data commits
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(secrets\.toml|\.env(\..*)?|.*\.(duckdb|sqlite|db)|service[_-]?role.*\.json)$'; then
            echo 'Remove the tracked private file and rotate any exposed credentials.'
            exit 1
          fi
      - name: Install runtime and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m py_compile app.py alpha_backup.py setup_auth.py health_check.py feature_engine.py intraday_exit.py commodity_etps.py commodity_signals.py commodity_ml.py commodity_worker.py commodity_dashboard.py auto_refresh_schedule.py option_retirement.py share_research.py share_worker.py
      - name: Run offline regressions
        run: python -m pytest -q tests
