name: ALPHA-LSE autonomous UK share intelligence
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Worker task'
        type: choice
        required: true
        default: check
        options: [check, daily, audit, monitor]
  schedule:
    # Single end-of-day research run on UK weekdays, in UTC.
    - cron: '47 20 * * 1-5'
concurrency:
  group: alpha-lse-share-research-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  share-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_MODEL_SERVICE_KEY: ${{ secrets.SUPABASE_MODEL_SERVICE_KEY }}
      ALPHA_COMMODITY_ML_BUCKET: ${{ vars.ALPHA_COMMODITY_ML_BUCKET || 'alpha-lse-models' }}
      ALPHA_SHARE_MAX_SYMBOLS: ${{ vars.ALPHA_SHARE_MAX_SYMBOLS || '120' }}
      ALPHA_REFRESH_UNIVERSE: '1'
      ALPHA_ALERT_WEBHOOK_URL: ${{ secrets.ALPHA_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install worker dependencies
        run: python -m pip install -r requirements-worker.txt
      - name: UK share daily forecast and five-session verification
        if: github.event_name == 'schedule'
        run: python share_worker.py --mode daily
      - name: Weekly accounting audit within the same scheduled run
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = '5' ]; then
            python share_worker.py --mode audit
          else
            echo 'Accounting audit scheduled for Friday within this workflow run.'
          fi
      - name: Manual action
        if: github.event_name == 'workflow_dispatch'
        run: python share_worker.py --mode '${{ inputs.mode }}'
