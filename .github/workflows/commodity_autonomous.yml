name: ALPHA-LSE autonomous commodity research
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Worker task'
        type: choice
        required: true
        default: daily
        options: [check, daily, monitor, health, backup]
  schedule:
    # GitHub schedules use UTC and can be late/dropped. Runtime checks London XLON calendar.
    - cron: '17 8-16 * * 1-5'
    - cron: '43 18 * * 1-5'
    - cron: '13 20 * * 1-5'
    - cron: '29 11 * * 1-5'
    - cron: '23 20 * * 0'
concurrency:
  group: alpha-lse-commodity-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  background-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_MODEL_SERVICE_KEY: ${{ secrets.SUPABASE_MODEL_SERVICE_KEY }}
      ALPHA_COMMODITY_ML_BUCKET: ${{ vars.ALPHA_COMMODITY_ML_BUCKET || 'alpha-lse-models' }}
      ALPHA_ALERT_WEBHOOK_URL: ${{ secrets.ALPHA_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-worker.txt
      - name: Market research scan (independent of the Streamlit browser)
        if: github.event_name == 'schedule' && github.event.schedule == '17 8-16 * * 1-5'
        run: python commodity_worker.py --mode monitor
      - name: Daily model research and five-session outcome audit
        if: github.event_name == 'schedule' && (github.event.schedule == '43 18 * * 1-5' || github.event.schedule == '13 20 * * 1-5')
        run: python commodity_worker.py --mode daily
      - name: Scheduled worker heartbeat check
        if: github.event_name == 'schedule' && github.event.schedule == '29 11 * * 1-5'
        run: python commodity_worker.py --mode health
      - name: Weekly backup of complete Supabase paper journal
        if: github.event_name == 'schedule' && github.event.schedule == '23 20 * * 0'
        run: python commodity_worker.py --mode backup
      - name: On-demand worker run
        if: github.event_name == 'workflow_dispatch'
        run: python commodity_worker.py --mode '${{ inputs.mode }}'
