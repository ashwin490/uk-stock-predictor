name: ALPHA-LSE autonomous commodity research
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Worker task'
        type: choice
        required: true
        default: daily
        options: [check, daily, monitor, health, backup]
  schedule:
    # Single end-of-day research run on UK weekdays, in UTC.
    - cron: '13 20 * * 1-5'
concurrency:
  group: alpha-lse-commodity-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  background-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_MODEL_SERVICE_KEY: ${{ secrets.SUPABASE_MODEL_SERVICE_KEY }}
      ALPHA_COMMODITY_ML_BUCKET: ${{ vars.ALPHA_COMMODITY_ML_BUCKET || 'alpha-lse-models' }}
      ALPHA_ALERT_WEBHOOK_URL: ${{ secrets.ALPHA_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-worker.txt
      - name: Daily model research and five-session outcome audit
        if: github.event_name == 'schedule'
        run: python commodity_worker.py --mode daily
      - name: Weekly journal backup within the same scheduled run
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = '5' ]; then
            python commodity_worker.py --mode backup
          else
            echo 'Backup scheduled for Friday within this workflow run.'
          fi
      - name: On-demand worker run
        if: github.event_name == 'workflow_dispatch'
        run: python commodity_worker.py --mode '${{ inputs.mode }}'
